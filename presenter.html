<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presenter</title>
<style>
:root{--red:#a6192e;--deep:#7d1223;--w:#fff;--soft:rgba(255,255,255,.82);--line:rgba(255,255,255,.35);--warn:#ffe08a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--red);color:var(--w);font:20px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column}
#stage{flex:1;padding:4vh 6vw;overflow:auto}
h1{font-size:clamp(1.8rem,4.2vw,3.4rem);line-height:1.15;margin:0 0 .4em}
.mut{color:var(--soft)}
.row{display:grid;grid-template-columns:2.2em 1fr 5.5em;gap:.9em;align-items:center;margin:.7em 0}
.row .l{font-weight:700;font-size:1.3em}
.bar{position:relative;background:rgba(255,255,255,.14);border:2px solid var(--line);border-radius:10px;min-height:3.2em;overflow:hidden;display:flex;align-items:center}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--w);opacity:.4;width:0;transition:width .4s}
.bar span{position:relative;padding:.5em .9em;font-size:clamp(1rem,2vw,1.5rem)}
.num{text-align:right;font-weight:700;font-size:1.3em}
.num small{display:block;font-weight:400;color:var(--soft);font-size:.65em}
#bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 16px;background:var(--deep);font-size:16px}
#bar .sp{flex:1}
button,input{font:inherit;font-size:16px}
button{padding:9px 16px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--w);cursor:pointer}
button:disabled{opacity:.4;cursor:default}
button.p{background:var(--w);color:var(--red);border-color:var(--w);font-weight:700}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn)}
input{padding:10px;border-radius:8px;border:1px solid var(--w);background:var(--w);color:#2a1218;width:100%;max-width:340px;margin:6px 0}
.lobby{display:flex;gap:5vw;align-items:center;flex-wrap:wrap}
#qr{background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-weight:700}
.count{font-size:clamp(2.5rem,6vw,5rem);font-weight:700;line-height:1}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="questions.js"></script>
</head><body>
<div id="stage"></div><div id="bar" hidden></div>
<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database(), auth = firebase.auth(), Q = QUESTIONS;
const stage = document.getElementById('stage'), bar = document.getElementById('bar');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {current:-1}, people = {}, answers = {}, started = false;

function loginView(msg){
  bar.hidden = true;
  stage.innerHTML = `<h1>Presenter sign-in</h1><p class="mut">${esc(msg||'Use the presenter account you created in Firebase.')}</p>
  <input id="e" type="email" placeholder="Email" autocomplete="username"><br>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password"><br>
  <button class="p" id="in">Sign in</button>`;
  const go = () => auth.signInWithEmailAndPassword(document.getElementById('e').value, document.getElementById('p').value)
    .catch(() => loginView('Sign-in failed. Check the email and password.'));
  document.getElementById('in').onclick = go;
  document.getElementById('p').onkeydown = e => { if(e.key==='Enter') go(); };
}

auth.onAuthStateChanged(u => { if(u) start(); else loginView(); });

function start(){
  if(started) return; started = true;
  db.ref('state').on('value', s => {
    if(!s.val()){ db.ref('state').set({current:-1, eventId: Math.random().toString(36).slice(2)}); return; }
    state = s.val(); draw();
  });
  db.ref('people').on('value', s => { people = s.val() || {}; draw(); });
  db.ref('answers').on('value', s => { answers = s.val() || {}; draw(); });
}

const setCur = n => db.ref('state/current').set(Math.max(-1, Math.min(Q.length, n)));

function tally(c){
  const q = Q[c], counts = q.options.map(()=>0), a = answers[c] || {};
  Object.values(a).forEach(v => { (typeof v === 'number' ? [v] : Object.values(v)).forEach(i => { if(counts[i]!==undefined) counts[i]++; }); });
  return {counts, n: Object.keys(a).length};
}

function draw(){
  if(!started) return;
  const c = state.current, joined = Object.keys(people).length;
  bar.hidden = false;
  if(c < 0){
    const url = new URL('index.html', location.href).href;
    stage.innerHTML = `<h1>${esc(EVENT_TITLE)}</h1><div class="lobby"><div id="qr"></div>
      <div><p>Scan to join, or go to</p><p class="url">${esc(url)}</p>
      <p class="mut">Joined so far</p><div class="count">${joined}</div></div></div>`;
    new QRCode(document.getElementById('qr'), {text:url, width:260, height:260});
  } else if(c >= Q.length){
    stage.innerHTML = `<h1>Thank you!</h1><p class="mut">${joined} people joined.</p>`;
  } else {
    const q = Q[c], t = tally(c), max = Math.max(1, ...t.counts);
    stage.innerHTML = `<p class="mut">Question ${c+1} of ${Q.length}${q.multi?' · select all that apply':''}</p><h1>${esc(q.text)}</h1>` +
      q.options.map((o,i) => `<div class="row"><div class="l">${'ABCDEFGH'[i]}</div>
        <div class="bar"><i style="width:${t.counts[i]/max*100}%"></i><span>${esc(o)}</span></div>
        <div class="num">${t.counts[i]}<small>${t.n ? Math.round(t.counts[i]/t.n*100) : 0}%</small></div></div>`).join('') +
      `<p class="mut">${t.n} of ${joined} responded</p>`;
  }
  bar.innerHTML = `<button id="prev" ${c<0?'disabled':''}>Back</button>
    <button class="p" id="next" ${c>=Q.length?'disabled':''}>${c<0?'Start':c===Q.length-1?'Finish':'Next question'}</button>
    <span class="sp"></span><span class="mut">${joined} joined</span>
    <button id="csv">Download CSV</button><button id="reset">Reset all data</button><button id="out">Sign out</button>`;
  document.getElementById('prev').onclick = () => setCur(c-1);
  document.getElementById('next').onclick = () => setCur(c+1);
  document.getElementById('csv').onclick = exportCsv;
  document.getElementById('out').onclick = () => { started = false; db.ref().off(); auth.signOut(); };
  document.getElementById('reset').onclick = () => {
    if(!confirm('Delete all joined people and answers, and start over?')) return;
    db.ref().update({people:null, answers:null, state:{current:-1, eventId: Math.random().toString(36).slice(2)}});
  };
}

function exportCsv(){
  const ci = Q.length - 1, q = Q[ci], a = answers[ci] || {};
  const cell = v => '"' + String(v).replace(/"/g,'""') + '"';
  const rows = [['First name','College email','Committee interests']];
  Object.entries(people).sort((x,y)=>x[1].joined-y[1].joined).forEach(([id,p]) => {
    const v = a[id], idx = v===undefined ? [] : (typeof v==='number' ? [v] : Object.values(v));
    rows.push([p.name, p.email, idx.map(i=>q.options[i]).join('; ')]);
  });
  const blob = new Blob(['\ufeff' + rows.map(r=>r.map(cell).join(',')).join('\r\n')], {type:'text/csv'});
  const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = 'committee-interest.csv'; l.click();
}
</script></body></html>
